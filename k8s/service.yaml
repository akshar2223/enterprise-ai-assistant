# ClusterIP Service — internal traffic only.
# External access is handled by ingress.yaml (Nginx Ingress Controller).
# To expose directly (e.g. on EKS), change type to LoadBalancer and
# annotate with service.beta.kubernetes.io/aws-load-balancer-type: nlb
#
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-service
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/name: enterprise-ai-assistant
    app.kubernetes.io/component: api
  annotations:
    # Enable Prometheus scraping of /metrics if you add a metrics endpoint
    prometheus.io/scrape: "false"
    prometheus.io/port:  "8000"
spec:
  type: ClusterIP
  selector:
    app: enterprise-ai-api      # matches Deployment pod label
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000
