# ⚠️  SECRET TEMPLATE — do NOT commit real values.
#
# In production, inject secrets via:
#   - External Secrets Operator (recommended): syncs from AWS Secrets Manager / Vault
#   - kubectl create secret generic enterprise-ai-secrets --from-env-file=.env
#   - CI/CD pipeline: kubectl apply with secret values injected from CI secrets
#
# All values must be base64-encoded when placed directly in this file.
# Example: echo -n "my-secret" | base64
#
# In this project's CI pipeline, the deploy job uses:
#   kubectl create secret generic enterprise-ai-secrets \
#     --from-literal=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
#     --from-literal=POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
#     --from-literal=JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
#     --from-literal=DATABASE_URL=${{ secrets.DATABASE_URL }} \
#     --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: enterprise-ai-secrets
  namespace: enterprise-ai
  labels:
    app.kubernetes.io/name: enterprise-ai-assistant
type: Opaque
data:
  # Replace with: echo -n "<your-value>" | base64
  OPENAI_API_KEY:   REPLACE_WITH_BASE64_ENCODED_KEY
  POSTGRES_PASSWORD: REPLACE_WITH_BASE64_ENCODED_PASSWORD
  JWT_SECRET_KEY:   REPLACE_WITH_BASE64_ENCODED_KEY
  DATABASE_URL:     REPLACE_WITH_BASE64_ENCODED_URL
