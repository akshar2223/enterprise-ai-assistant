[pytest]
# pytest-asyncio: auto mode means no @pytest.mark.asyncio needed per test
asyncio_mode = auto

# Where to find tests
testpaths = tests

# Show live logs during test run
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

# Fail fast on first error during collection
# addopts = --tb=short -q

# Markers
markers =
    unit: Pure unit test (no I/O, no network)
    integration: Requires mocked or real external dependencies
    slow: Long-running test (skipped in CI fast lane)
